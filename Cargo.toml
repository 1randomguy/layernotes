[package]
name = "layernotes"
description = "Bottom-layer Wayland post-it notes stored as markdown files"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"

[profile.release]
lto = "thin"
strip = true
opt-level = 3

[dependencies]
# Same iced layer-shell backend as ashell, re-exported under the `iced` name.
iced = { package = "iced_layershell", git = "https://github.com/MalpenZibo/iced_layershell", tag = "v0.2.1", features = [
  "tokio",
  "advanced",
  "wgpu",
  "tiny-skia",
  "image",
  "svg",
  "canvas",
  "markdown",
  "highlighter",
] }
# Needed to run widget operations (programmatic focus of the note editor).
iced_runtime = "0.14"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "1"
inotify = { version = "0.11.1", default-features = false, features = [
  "stream",
] }
clap = { version = "4.5", default-features = false, features = [
  "std",
  "derive",
  "help",
] }
anyhow = "1"
log = "0.4"
flexi_logger = "0.31"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", default-features = false, features = [
  "fs",
  "time",
  "net",
] }
wayland-client = "0.31"

[patch.crates-io]
# Patched softbuffer that uses wl_shm Argb8888 so the tiny-skia fallback
# renderer honors alpha on Wayland. Only relevant if wgpu is unavailable.
softbuffer = { git = "https://github.com/MalpenZibo/softbuffer", branch = "wayland-argb" }
